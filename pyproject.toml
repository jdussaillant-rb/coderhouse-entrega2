[project]
name = "pipeline-extraccion-tecnica"
version = "0.2.0"
description = "Pipeline LCEL que extrae entidades técnicas de un texto y devuelve un objeto Pydantic validado."
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
